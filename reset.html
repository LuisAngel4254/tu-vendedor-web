<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Vendedor - Nueva contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      background: linear-gradient(135deg, #1d0f12, #7a1f2b 55%, #e63946);
    }
    .card {
      background: #fff; width: 100%; max-width: 380px; border-radius: 20px;
      padding: 1.6rem; box-shadow: 0 12px 32px rgba(0,0,0,.3); text-align: center;
    }
    h1 { color: #c1121f; font-size: 1.4rem; margin-bottom: .4rem; }
    p.sub { color: #555; font-size: .92rem; margin-bottom: 1.1rem; }
    input {
      width: 100%; padding: .8rem; margin-bottom: .8rem; border: 1px solid #ccc;
      border-radius: 10px; font-size: 1rem;
    }
    button {
      width: 100%; padding: .85rem; border: 0; border-radius: 10px; font-size: 1rem;
      background: #e63946; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: .9rem; font-size: .92rem; }
    .ok { color: #2a9d8f; font-weight: 600; }
    .err { color: #c1121f; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏪 Tu Vendedor</h1>

    <div id="cargando"><p class="sub">Verificando tu enlace…</p></div>

    <div id="invalido" class="hidden">
      <p class="sub err">Este enlace no es válido o ya venció.<br>Vuelve a la app y pide uno nuevo con «¿Olvidaste tu contraseña?».</p>
    </div>

    <form id="form" class="hidden">
      <p class="sub">Crea tu contraseña nueva</p>
      <input type="password" id="pass1" placeholder="Contraseña nueva (mínimo 6 caracteres)" autocomplete="new-password" required>
      <input type="password" id="pass2" placeholder="Repite la contraseña" autocomplete="new-password" required>
      <button type="submit" id="btn">Guardar contraseña</button>
      <p class="msg err" id="error"></p>
    </form>

    <div id="listo" class="hidden">
      <p class="msg ok">✅ Contraseña actualizada.</p>
      <p class="sub" style="margin-top:.6rem">Ya puedes volver a la app e iniciar sesión con tu contraseña nueva.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pvmhgqmarshjkmbnclqj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2bWhncW1hcnNoamttYm5jbHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNTI0NjYsImV4cCI6MjA5NzgyODQ2Nn0.b6DduVrDULFAFi5uBQ6GQnzcyNRZwm4iM5rykgqLRrU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    function mostrar(id) {
      ['cargando', 'invalido', 'form', 'listo'].forEach((x) => $(x).classList.add('hidden'));
      $(id).classList.remove('hidden');
    }

    // El enlace del correo trae la sesión de recuperación en la URL; supabase-js
    // la detecta sola y avisa con el evento PASSWORD_RECOVERY.
    let recuperacionLista = false;
    _supabase.auth.onAuthStateChange((evento) => {
      if (evento === 'PASSWORD_RECOVERY') {
        recuperacionLista = true;
        mostrar('form');
      }
    });
    // Si en unos segundos no hubo sesión de recuperación, el enlace no sirve.
    setTimeout(() => { if (!recuperacionLista) mostrar('invalido'); }, 5000);

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('error').textContent = '';
      const p1 = $('pass1').value, p2 = $('pass2').value;
      if (p1.length < 6) { $('error').textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
      if (p1 !== p2) { $('error').textContent = 'Las dos contraseñas no coinciden.'; return; }

      $('btn').disabled = true;
      const { error } = await _supabase.auth.updateUser({ password: p1 });
      if (error) {
        $('btn').disabled = false;
        $('error').textContent = 'No se pudo guardar: ' + error.message;
        return;
      }
      await _supabase.auth.signOut();
      mostrar('listo');
    });
  </script>
</body>
</html>
